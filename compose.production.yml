services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      POSTGRES_DB: macro_influencer
      POSTGRES_USER: macro_influencer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro_influencer -d macro_influencer"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${REGISTRY_IMAGE:-macro-influencer}:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    environment:
      VIZ_PORT: "5180"
      LLM_BACKEND: ${LLM_BACKEND:-fox}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      WEIBO_COOKIE: ${WEIBO_COOKIE:-}
      AUTH_USERNAME: ${AUTH_USERNAME:?AUTH_USERNAME must be set}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD must be set}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET must be set}
      DATABASE_URL: postgresql://macro_influencer:${POSTGRES_PASSWORD}@db:5432/macro_influencer
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 共享 Caddy 在另一个 Docker network，经宿主机网关访问此端口。
      # VPS 防火墙只开放 22/80/443，5180 不对公网放行。
      - "${HOST_PORT:-5180}:5180"
    volumes:
      - runs_data:/app/runs
      - cache_data:/app/cache

volumes:
  runs_data:
  cache_data:
  postgres_data:
